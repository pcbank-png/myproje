<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3b2032">
  <title>NSX Salon Takip · Çevrimdışı</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#faf7f2;color:#24151f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(480px,100%);padding:34px;border:1px solid #e8ddcf;border-radius:26px;background:#fff;box-shadow:0 20px 55px rgba(59,32,50,.12);text-align:center}.icon{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#fbf5e7;font-size:34px}h1{margin:20px 0 10px;font-size:25px}p{margin:0;color:#7c7076;line-height:1.6}.btn{margin-top:22px;border:0;border-radius:14px;padding:13px 19px;background:#3b2032;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="icon">☁</div><h1>İnternet bağlantısı bekleniyor</h1><p>Salon verileri güvenlik nedeniyle cihazda çevrimdışı saklanmaz. Bağlantı geldiğinde paneli yeniden açabilirsiniz.</p><button class="btn" onclick="location.reload()">Tekrar Dene</button></main></body>
</html>
